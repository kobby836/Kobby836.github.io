<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amoah Fredrick Kobby | Telecom Engineer</title>

  <meta name="description" content="Portfolio of Amoah Fredrick Kobby, Telecom Engineer.">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      line-height: 1.6;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(11, 17, 32, 0.95);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    section {
      padding: 100px 8%;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: radial-gradient(circle at top right, #12345a, #0b1120 45%);
    }

    .hero-content {
      max-width: 750px;
    }

    .hero small {
      color: #38bdf8;
      font-size: 18px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 75px);
      line-height: 1.1;
      margin: 15px 0;
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 19px;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      background: #38bdf8;
      color: #06101c;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
      margin-right: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    .title {
      text-align: center;
      margin-bottom: 50px;
    }

    .title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .title p {
      color: #94a3b8;
    }

    .about {
      background: #0f172a;
    }

    .about-content {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .about-content p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .skill {
      background: #111c31;
      padding: 25px;
      text-align: center;
      border: 1px solid #1e293b;
      border-radius: 10px;
      transition: 0.3s;
    }

    .skill:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
    }

    .skill h3 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .skill p {
      color: #94a3b8;
      font-size: 14px;
    }

    .projects {
      background: #0f172a;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .project {
      background: #111c31;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }

    .project h3 {
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .project p {
      color: #cbd5e1;
    }

    .contact {
      text-align: center;
    }

    .contact-box {
      max-width: 650px;
      margin: auto;
      background: #111c31;
      padding: 35px;
      border-radius: 12px;
      border: 1px solid #1e293b;
    }

    .contact-box p {
      margin: 15px 0;
      color: #cbd5e1;
    }

    .contact-box a {
      color: #38bdf8;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #060b14;
      color: #64748b;
      border-top: 1px solid #1e293b;
    }

    @media (max-width: 700px) {
      nav {
        padding: 15px 5%;
      }

      nav a {
        margin-left: 10px;
        font-size: 12px;
      }

      section {
        padding: 80px 5%;
      }

      .hero h1 {
        font-size: 45px;
      }

      .hero p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">Kobby<span>.</span></div>

    <div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>


  <!-- HOME -->
